name: glucotrust

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Only reachable by other containers; no public Ollama port.

  app:
    image: glucotrust-lite:${GLUCOTRUST_IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      GLUCOTRUST_MODEL: qwen3:4b-instruct-2507-q4_K_M
      GLUCOTRUST_OLLAMA_HOST: http://ollama:11434
      GLUCOTRUST_TIMEOUT_SECONDS: ${GLUCOTRUST_TIMEOUT_SECONDS:-180}
      GLUCOTRUST_REQUESTS_PER_MINUTE: ${GLUCOTRUST_REQUESTS_PER_MINUTE:-6}
      GLUCOTRUST_MAX_CONCURRENT_REQUESTS: ${GLUCOTRUST_MAX_CONCURRENT_REQUESTS:-1}
      GLUCOTRUST_FEEDBACK_PATH: /app/runtime/feedback.jsonl
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - app-cache:/app/data/cache
      - feedback:/app/runtime

volumes:
  ollama-models:
  app-cache:
  feedback:
