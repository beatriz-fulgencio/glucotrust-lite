# Add this override after DNS points your domain at the server.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      GLUCOTRUST_DOMAIN: ${GLUCOTRUST_DOMAIN:?Set GLUCOTRUST_DOMAIN in .env.deploy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
