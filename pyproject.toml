[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glucotrust-lite"
version = "0.1.0"
description = "Evidence-grounded diabetes claim assessment research prototype"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<4", "rank-bm25==0.2.2", "sentence-transformers>=5,<7",
  "ollama>=0.6,<1", "httpx>=0.27,<1", "pydantic>=2.12,<3", "scikit-learn>=1.7,<2",
  "streamlit>=1.50,<2", "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
